name: CI Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - run: black --check .
      - run: isort --check .
      - run: flake8 app/ tests/
      - run: mypy app/
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95
      - run: pip-audit

  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeboard
          POSTGRES_PASSWORD: pipeboard
          POSTGRES_DB: pipeboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pipeboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIPEBOARD_TEST_POSTGRES_URL: postgresql+psycopg://pipeboard:pipeboard@localhost:5432/pipeboard_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-postgres.txt
      - run: pytest tests/test_postgres.py tests/test_migrations.py --no-cov -v
