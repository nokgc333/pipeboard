name: CI Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run type-check
      - name: Generated API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api-types.ts

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run test -- --coverage

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.migrate
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 &
          sleep 2
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.migrate
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 &
          sleep 2
      - run: npm install
      - run: npm run build
      - run: nohup npx next start -p 3000 &
      - run: sleep 5
      - name: Measure the board and a detail page (three runs each; performance is judged by its median)
        run: |
          mkdir -p lighthouse
          for page in "" "shots/1"; do
            for run in 1 2 3; do
              npx --yes lighthouse@12 "http://localhost:3000/$page" \
                --only-categories=performance,accessibility,seo,best-practices \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="lighthouse/$(echo "$page" | tr '/' '_')index-$run.json" --quiet
            done
          done
      - run: node scripts/assert-lighthouse.mjs lighthouse/*.json
