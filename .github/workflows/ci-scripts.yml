name: CI Scripts

on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/ci-scripts.yml"]
  pull_request:
    paths: ["scripts/**", ".github/workflows/ci-scripts.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests pytest black isort flake8 mypy types-requests
      - run: black --check scripts/
      - run: isort --check scripts/
      - run: flake8 --max-line-length=100 --extend-ignore=E203 scripts/
      - run: mypy scripts/houdini_status_update.py scripts/houdini_publish.py
      - run: pytest scripts/tests/ -v
