name: CI Desktop

on:
  push:
    branches: [main]
    paths: ["desktop_client/**", ".github/workflows/ci-desktop.yml"]
  pull_request:
    paths: ["desktop_client/**", ".github/workflows/ci-desktop.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop_client
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries for the offscreen platform
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - run: black --check .
      - run: isort --check .
      - run: flake8 --max-line-length=100 --extend-ignore=E203 .
      - run: mypy .
      - run: pytest
      - run: pip-audit
