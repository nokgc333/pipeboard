version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      # One pull request per week for every Python update: the "update requirement" bumps
      # raise a floor (CI already installs the latest), so they are safe to review together.
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /desktop_client
    schedule:
      interval: weekly
    groups:
      # One pull request per week for every Python update: the "update requirement" bumps
      # raise a floor (CI already installs the latest), so they are safe to review together.
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 22 (.nvmrc), so the type definitions stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The ESLint plugins in eslint-config-next do not support ESLint 10 yet, and
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # The base image follows .nvmrc (Node 22), not the newest Node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
