[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
