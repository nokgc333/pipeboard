services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pipeboard_db:/app/data
      - uploads:/app/uploads
    environment:
      PIPEBOARD_DATABASE_URL: sqlite:////app/data/pipeboard.db
      PIPEBOARD_AUTH_MODE: ${PIPEBOARD_AUTH_MODE:-local}
      PIPEBOARD_API_TOKENS: ${PIPEBOARD_API_TOKENS:-}
      PIPEBOARD_CORS_ORIGINS: ${PIPEBOARD_CORS_ORIGINS:-http://localhost:3000}
      PIPEBOARD_REQUIRED_CHECKS: ${PIPEBOARD_REQUIRED_CHECKS:-}
      PIPEBOARD_WEBHOOK_URL: ${PIPEBOARD_WEBHOOK_URL:-}
      PIPEBOARD_WEBHOOK_SECRET: ${PIPEBOARD_WEBHOOK_SECRET:-}
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pipeboard_db:
  uploads:
