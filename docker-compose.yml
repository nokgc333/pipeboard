services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - pipeboard_db:/app/data
      - uploads:/app/uploads
    environment:
      PIPEBOARD_DATABASE_URL: sqlite:////app/data/pipeboard.db
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pipeboard_db:
  uploads:
